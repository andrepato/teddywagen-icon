name: Compile Icon Catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile asset catalog
        run: |
          mkdir -p out
          xcrun actool Assets.xcassets --compile out --platform iphoneos --minimum-deployment-target 26.0 --app-icon AppIcon --output-partial-info-plist out/partial-info.plist
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-icon-catalog
          path: out/
